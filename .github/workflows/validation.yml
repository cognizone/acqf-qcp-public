name: Check published validation model
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Regression baseline is an earlier dev commit.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r publication/requirements.txt
      - name: Rebuild and check the committed export
        run: python tools/build-exchange-model.py --check
      - name: Check ACQF equivalence and invalid publication inputs
        run: python tools/test-exchange-model.py
      - name: Install pinned Jena validator
        run: |
          curl -fsSL --retry 3 https://archive.apache.org/dist/jena/binaries/apache-jena-5.6.0.tar.gz -o "$RUNNER_TEMP/jena.tar.gz"
          tar -xzf "$RUNNER_TEMP/jena.tar.gz" -C "$RUNNER_TEMP"
          echo "JENA_HOME=$RUNNER_TEMP/apache-jena-5.6.0" >> "$GITHUB_ENV"
      - name: Validate the standalone artifact
        run: java -cp "$JENA_HOME/lib/*" tools/ValidateExchangeModel.java docs/model/exchange-model.ttl acqf
