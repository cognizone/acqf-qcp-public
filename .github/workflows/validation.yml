name: Check and preview the public data site
on:
  push:
    branches: [dev2]
  pull_request:
    branches: [dev2]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: build/tools
          key: jena-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('publication/jena.sha512') }}
      - name: Install pinned Apache Jena CLI
        run: |
          bash publication/setup-jena.sh
          read -r checksum archive < publication/jena.sha512
          echo "$PWD/build/tools/${archive%.tar.gz}/bin" >> "$GITHUB_PATH"
      - name: Check both product exports and validation contracts
        run: bash publication/publish.sh check
      - name: Upload the complete site preview
        uses: actions/upload-artifact@v7
        with:
          name: public-data-site-${{ github.sha }}
          path: docs/
          if-no-files-found: error
