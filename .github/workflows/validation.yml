name: Check and preview the public data site
on:
  push:
    branches: [dev2]
  pull_request:
    branches: [dev2]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: build/tools
          key: jena-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('publication/jena.sha512') }}
      - name: Check website resources and both product contracts
        run: ./gradlew check
      - name: Upload the complete site preview
        uses: actions/upload-artifact@v7
        with:
          name: public-data-site-${{ github.sha }}
          path: build/site/
          if-no-files-found: error
