name: Validate published RDF
description: Install the pinned Jena CLI and run the same publication checks as locally.
inputs:
  common-root:
    description: Path to the checkout containing the shared publisher.
    default: '.'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/cache@v4
      with:
        path: build/tools
        key: jena-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/publication/jena.sha512', inputs.common-root)) }}
    - name: Install pinned Apache Jena CLI
      shell: bash
      env:
        COMMON_ROOT: ${{ inputs.common-root }}
      run: |
        bash "$COMMON_ROOT/publication/setup-jena.sh" "$PWD/build/tools"
        read -r checksum archive < "$COMMON_ROOT/publication/jena.sha512"
        echo "$PWD/build/tools/${archive%.tar.gz}/bin" >> "$GITHUB_PATH"
    - name: Check export and standalone SHACL validation
      shell: bash
      run: bash publication/publish.sh check
